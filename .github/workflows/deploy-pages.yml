name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:pages

      - name: Prepare Pages artifact
        run: |
          SITE_DIR="dist/world-map/browser"
          touch "$SITE_DIR/.nojekyll"
          # SPA fallback for deep links / refresh
          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/world-map/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare API token
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set; skipping Cloudflare Pages deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cloudflare.outputs.deploy == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.cloudflare.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.cloudflare.outputs.deploy == 'true'
        run: npm ci

      - name: Build
        if: steps.cloudflare.outputs.deploy == 'true'
        run: npm run build:cf

      - name: SPA fallback
        if: steps.cloudflare.outputs.deploy == 'true'
        run: cp dist/world-map/browser/index.html dist/world-map/browser/404.html

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/world-map/browser --project-name=trailbound-world-map --branch=main --commit-hash=${{ github.sha }}
